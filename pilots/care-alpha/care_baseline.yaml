version: 1
baseline_id: CARE-BASELINE-V1-SYNTHETIC
source_controls: model/sample_controls.yaml
applicability_status: PROPOSED
controls:
  - {id: SS-GOV-001, applicable: true, priority: high, rationale: "small organization still needs explicit accountable ownership"}
  - {id: SS-RISK-001, applicable: true, priority: high, rationale: "health information and care continuity create material security risk"}
  - {id: SS-ASSET-001, applicable: true, priority: high, rationale: "critical ECD, identity, mobile and supplier dependencies must be known"}
  - {id: SS-ACCESS-001, applicable: true, priority: critical, rationale: "remote/mobile access to sensitive information"}
