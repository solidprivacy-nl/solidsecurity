name: One-shot SS GAP-01 exact-byte transfer

on:
  push:
    branches:
      - control/transfer-ss-gap01-20260916

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@v4
        with:
          ref: r2/32-executable-assurance-kernel
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Verify frozen starting identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c1d92f48f278d615f40c2bfd50f47c8b9b770ffe"

      - name: Restore exact tested validator bytes
        shell: bash
        env:
          EXPECTED_SHA256: 2f14f6694cebe20038eaeb809c27af13b4c4cfd888f22e4a3f883e6cd80faad8
          FILE_GZIP_BASE64: 
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          raw = gzip.decompress(base64.b64decode(os.environ['FILE_GZIP_BASE64']))
          actual = hashlib.sha256(raw).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if actual != expected:
              raise SystemExit(f'SHA mismatch: {actual} != {expected}')
          Path('tools/validate_assurance_kernel.py').write_bytes(raw)
          PY

      - name: Verify bounded repair and repository validation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "tools/validate_assurance_kernel.py"
          test "$(git diff --numstat -- tools/validate_assurance_kernel.py)" = $'26\t13\ttools/validate_assurance_kernel.py'
          python -m py_compile tools/validate_assurance_kernel.py
          python tools/validate_assurance_kernel.py
          python tools/validate_foundation.py

      - name: Commit exact tested repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "control-transfer"
          git config user.email "control-transfer@users.noreply.github.com"
          git add tools/validate_assurance_kernel.py
          git commit -m "SS GAP-01: normalize cutoffs and fail closed on expired evidence"
          git push origin HEAD:r2/32-executable-assurance-kernel
